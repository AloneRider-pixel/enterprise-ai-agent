name: ForgeAI CI

on:
  push:
    branches: [main, forgeai-v1]
    paths:
      - "forgeai/**"
      - ".github/workflows/forgeai-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "forgeai/**"
      - ".github/workflows/forgeai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and test ForgeAI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgeai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forgeai/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest --cov=forgeai --cov-report=term-missing
      - name: Docker build
        run: docker build -t forgeai:ci .
